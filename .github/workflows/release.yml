name: release
# Publishes a GitHub Release whenever main has a SpeakerNotes version that hasn't been released yet.
# To release: bump CFBundleShortVersionString (and CFBundleVersion) in app/Info.plist, add a
# CHANGELOG entry, and merge to main. The workflow creates the tag v<version> and the release.
on:
  push:
    branches: [main]
    paths:
      - "app/Info.plist"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: speakernotes-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Read the version and skip if already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
          echo "version=$VERSION"
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build the Mac app
        if: steps.version.outputs.skip != 'true'
        working-directory: app
        run: |
          swift test
          ./scripts/build-app.sh
          cp build/SpeakerNotes-macOS.zip ../SpeakerNotes-macOS.zip
      - name: Checksums
        if: steps.version.outputs.skip != 'true'
        run: shasum -a 256 SpeakerNotes-macOS.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "## Install or update"
            echo
            echo "Paste this in Terminal (macOS 13 or later):"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash"
            echo '```'
            echo
            echo "Or download **SpeakerNotes-macOS.zip** below, unzip it, and drag **SpeakerNotes.app** into Applications. The app isn't notarized yet, so the first time macOS says it \"could not verify\" the app: click **Done**, then open **System Settings > Privacy & Security** and click **Open Anyway**."
            echo
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md
      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" SpeakerNotes-macOS.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "SpeakerNotes $VERSION" --notes-file release-notes.md
